version: 0.2

phases:
  pre_build:
    commands:
      - nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock --host=tcp://127.0.0.1:2375 --storage-driver=overlay2&
      - timeout 30 sh -c "until docker info; do echo .; sleep 1; done"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com -u AWS --password-stdin
      - echo $DOCKER_HUB_ACCESS_TOKEN | docker login dhi.io -u $DOCKER_HUB_ORGANISATION --password-stdin

  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t prototypes-image ./

  post_build:
    commands:
      - echo Build completed on `date`
      - docker tag prototypes-image:latest $DOCKER_IMAGE_URI:latest
      - docker push $DOCKER_IMAGE_URI:latest

artifacts:
  files:
    - '**/*'

services:
  epb-prototypes:
    command: node ./node_modules/govuk-prototype-kit/bin/cli dev
    environment:
      - NODE_ENV=development
      - PORT=8080
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
      - '8081:8081'
    user: root
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
